<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Active Orders</title>
<style>
  :root { --amz:#ff9900; --fk:#2874f0; --bg:#f4f5f7; --card:#fff; --line:#e5e7eb; --muted:#6b7280; --ink:#111827; --green:#067d62; --amber:#b45309; }
  * { box-sizing:border-box; }
  body { width:390px; margin:0; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:#131921; color:#fff; }
  header h1 { font-size:14px; font-weight:600; margin:0; }
  header .count { background:var(--amz); color:#131921; border-radius:10px; padding:2px 8px; font-size:12px; font-weight:700; margin-left:6px; }
  #refresh { background:var(--amz); color:#131921; border:none; border-radius:6px; padding:5px 12px; font-size:12px; font-weight:700; cursor:pointer; }
  #refresh:disabled { opacity:.6; cursor:default; }
  .tabs { display:flex; gap:6px; padding:8px 12px 0; }
  .tab { font-size:12px; font-weight:600; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:16px; padding:4px 12px; cursor:pointer; }
  .tab.active { color:#fff; background:#131921; border-color:#131921; }
  main { padding:10px 12px 8px; max-height:520px; overflow-y:auto; }

  .bundle { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .bhead { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .bhead-l { display:flex; align-items:center; gap:7px; min-width:0; }
  .src { font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; color:#fff; white-space:nowrap; }
  .src.Amazon { background:var(--amz); color:#131921; }
  .src.Flipkart { background:var(--fk); }
  .oid { font-size:11px; color:var(--muted); font-family:ui-monospace,Menlo,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .arrival { font-size:12px; font-weight:700; color:var(--ink); white-space:nowrap; text-align:right; }
  .statusrow { font-size:13px; font-weight:700; margin-top:8px; }
  .statusrow.s0 { color:var(--amber); }
  .statusrow.s1, .statusrow.s2 { color:var(--fk); }
  .statusrow.s3 { color:var(--green); }

  .pbar { display:flex; align-items:center; margin:8px 0 6px; }
  .node { width:11px; height:11px; border-radius:50%; background:var(--line); flex:0 0 auto; border:2px solid var(--line); }
  .node.done { background:#fff; }
  .seg { flex:1; height:3px; background:var(--line); }
  .Amazon .node.done { border-color:var(--amz); background:var(--amz); }
  .Amazon .seg.done { background:var(--amz); }
  .Flipkart .node.done { border-color:var(--fk); background:var(--fk); }
  .Flipkart .seg.done { background:var(--fk); }

  .detail { font-size:12.5px; font-weight:600; margin-top:4px; line-height:1.35; }
  .detailmeta { font-size:11px; color:var(--muted); margin-top:1px; font-style:italic; }

  .items { margin-top:10px; border-top:1px dashed var(--line); padding-top:8px; }
  .item { display:flex; gap:10px; padding:5px 0; }
  .item img { width:40px; height:40px; object-fit:contain; border:1px solid var(--line); border-radius:6px; background:#fff; flex:0 0 40px; }
  .item .ib { flex:1; min-width:0; }
  .item .it { font-size:12px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .item .amt { font-size:12px; font-weight:700; margin-top:2px; }

  .state { text-align:center; color:var(--muted); font-size:13px; padding:30px 16px; line-height:1.6; }
  .footer { font-size:11px; color:var(--muted); text-align:center; padding:6px 0 8px; }
</style>
</head>
<body>
  <header>
    <h1>Active Orders <span class="count" id="count">–</span></h1>
    <button id="refresh">Refresh</button>
  </header>
  <div class="tabs" id="tabs">
    <span class="tab active" data-f="all">All</span>
    <span class="tab" data-f="Amazon">Amazon</span>
    <span class="tab" data-f="Flipkart">Flipkart</span>
  </div>
  <main id="list"><div class="state" id="state">Loading…</div></main>
  <div class="footer" id="footer"></div>
  <script src="popup.js"></script>
</body>
</html>
